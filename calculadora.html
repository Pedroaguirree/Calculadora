<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="./calculadora.css" />
  </head>
  <body>
    <main class="container" aria-label="Calculadora">
      <output class="display" id="display">
        <span class="expressao" id="expressao"></span>
        <span class="resultado" id="resultado" aria-live="polite">0</span>
      </output>

      <div class="container-calculator" id="teclado">
        <button type="button" class="buttons" data-acao="limpar" aria-label="Limpar tudo">C</button>
        <button type="button" class="buttons" data-acao="apagar" aria-label="Apagar">⌫</button>
        <button type="button" class="buttons" data-acao="porcentagem" aria-label="Porcentagem">%</button>
        <button type="button" class="buttons operator" data-op="+" aria-label="Somar">+</button>

        <button type="button" class="buttons" data-num="7">7</button>
        <button type="button" class="buttons" data-num="8">8</button>
        <button type="button" class="buttons" data-num="9">9</button>
        <button type="button" class="buttons operator" data-op="-" aria-label="Subtrair">−</button>

        <button type="button" class="buttons" data-num="4">4</button>
        <button type="button" class="buttons" data-num="5">5</button>
        <button type="button" class="buttons" data-num="6">6</button>
        <button type="button" class="buttons operator" data-op="/" aria-label="Dividir">÷</button>

        <button type="button" class="buttons" data-num="1">1</button>
        <button type="button" class="buttons" data-num="2">2</button>
        <button type="button" class="buttons" data-num="3">3</button>
        <button type="button" class="buttons operator" data-op="*" aria-label="Multiplicar">×</button>

        <button type="button" class="buttons" data-acao="sinal" aria-label="Trocar sinal">±</button>
        <button type="button" class="buttons" data-num="0">0</button>
        <button type="button" class="buttons" data-acao="decimal" aria-label="Vírgula">,</button>
        <button type="button" class="buttons equal" data-acao="igual" aria-label="Igual">=</button>
      </div>
    </main>

    <script src="./calculadora.js"></script>
  </body>
</html>
